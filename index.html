<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style></head><body>
<title>Prancheta FC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de técnico — barra de placar no topo, tela central, abas fixas embaixo; o "cartão de jogo" é um campo riscado a giz */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --surface2:#e8ede5; --line:#d5ddd1; --fg:#14201a; --muted:#5a6a60;
  --pitch:#1d7546; --pitch2:#18663c; --pitch-ink:#ffffff; --chalk:rgba(255,255,255,.28);
  --star:#b78800; --goal:#e9ad00; --danger:#c5372c; --warn:#c77d00; --ok:#1d7546; --info:#2f5fb3;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#151d18; --surface2:#1c2620; --line:#29352e; --fg:#e6eee8; --muted:#94a59b;
  --pitch:#1f6b43; --pitch2:#1a5b39; --pitch-ink:#f2fff6; --chalk:rgba(255,255,255,.22);
  --star:#f4c431; --goal:#f4c431; --danger:#ef5b50; --warn:#f0a33a; --ok:#41bd7b; --info:#77a2ee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151d18; --surface2:#1c2620; --line:#29352e; --fg:#e6eee8; --muted:#94a59b;
  --pitch:#1f6b43; --pitch2:#1a5b39; --pitch-ink:#f2fff6; --chalk:rgba(255,255,255,.22);
  --star:#f4c431; --goal:#f4c431; --danger:#ef5b50; --warn:#f0a33a; --ok:#41bd7b; --info:#77a2ee; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--info);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font:800 20px var(--display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:18px;border-radius:4px;background:var(--pitch);position:relative}
.brand i::after{content:"";position:absolute;inset:3px 8px;border-left:2px solid var(--pitch-ink)}
.club-mini{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
.club-mini b{font:700 16px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.cash{font:600 15px var(--display);color:var(--ok)} .cash.neg{color:var(--danger)}
.season{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mgrs{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}

main{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.label{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h-sec{font-size:22px;font-weight:700}

/* botões */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.btn.primary:hover{background:var(--pitch2)}
.btn.big{font:700 20px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:14px 22px;width:100%}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* escudo */
.crest{--c:#888;width:30px;height:34px;flex:none;display:grid;place-items:center;font:800 11px var(--display);letter-spacing:.03em;color:#fff;background:var(--c);
  border-radius:7px 7px 50% 50%/7px 7px 62% 62%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.crest.lg{width:58px;height:66px;font-size:18px;border-radius:12px 12px 50% 50%/12px 12px 62% 62%}
.crest.two{background:linear-gradient(90deg,var(--c) 0 33%,var(--c2) 33% 67%,var(--c) 67%);text-shadow:0 0 3px rgba(0,0,0,.9),0 1px 2px rgba(0,0,0,.8)}
.career .cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ccell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:9px 10px;min-height:64px;color:var(--fg);font:inherit;cursor:pointer;min-width:0}
.ccell:active{border-color:var(--line)}.ccell b{font:800 18px var(--display);line-height:1.1}.ccell small{color:var(--muted);font-size:12px;line-height:1.25}
.ccell .fchips{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}.ccell .formc{display:flex;gap:3px}.ccell .formc i{min-width:20px;width:20px;height:20px;padding:0;font-size:11px;line-height:20px;display:inline-block;text-align:center}.ccell .formc i small{display:none}.ccell .fchips .muted{font-size:12px}
.nav button{position:relative}.nbadge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font:700 11px/18px var(--body);text-align:center}
.imp{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}.imp span{background:rgba(255,255,255,.92);color:#123;border-radius:999px;padding:3px 10px;font:700 12px var(--body)}
.savedc{max-width:520px}
.hf>summary{min-height:36px;display:flex;align-items:center;gap:6px;cursor:pointer}
.seg button{min-width:44px}
[data-act=bidStep],[data-act=saleStep],[data-act=loanStep]{min-width:44px}
.seg[style*="flex-wrap"] button{flex:1 1 auto;border-top:1px solid var(--line);margin-top:-1px}
details.panel:not(.fold)>summary{min-height:40px;display:flex;align-items:center;cursor:pointer}
.tip{border-color:var(--info);gap:6px}.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.gloss{margin:0;display:grid;gap:6px}.gloss dt{font-weight:700}.gloss dd{margin:0 0 4px;color:var(--muted);font-size:14px}
.nk{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.toast.err{background:var(--danger);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle}
.rng{width:100%;height:36px;accent-color:var(--ok);margin:2px 0}
.crest.sm{width:22px;height:25px;font-size:8.5px}

/* cartão do jogo (campo) */
.pitch{position:relative;overflow:hidden;border-radius:16px;color:var(--pitch-ink);padding:18px 16px 20px;
  background:
   radial-gradient(circle at 50% 50%,transparent 46px,var(--chalk) 47px,var(--chalk) 49px,transparent 50px),
   linear-gradient(90deg,transparent calc(50% - 1px),var(--chalk) calc(50% - 1px),var(--chalk) calc(50% + 1px),transparent calc(50% + 1px)),
   repeating-linear-gradient(90deg,var(--pitch) 0 44px,var(--pitch2) 44px 88px)}
.pitch::before,.pitch::after{content:"";position:absolute;top:22%;bottom:22%;width:44px;border:2px solid var(--chalk)}
.pitch::before{left:-2px;border-left:0}.pitch::after{right:-2px;border-right:0}
.pitch .label{color:var(--pitch-ink);opacity:.85}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;position:relative;z-index:1;margin-top:10px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.vs .side b{font:700 18px/1.05 var(--display);text-wrap:balance}
.vs .side small{opacity:.85;font-size:12px}
.vs .x{font:800 30px var(--display);opacity:.9}
.score-big{font:800 46px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--pitch-ink)}

/* elenco */
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) 54px 58px 44px;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.psal{display:block;font:700 14px var(--display);color:var(--fg);margin-top:2px;font-variant-numeric:tabular-nums}
.prow .tags{display:flex;flex-direction:column;align-items:center;gap:3px}.pnota{font-size:11px;color:var(--muted);white-space:nowrap}
.prow.head{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:4px}
.prow.xi{background:color-mix(in srgb,var(--ok) 9%,transparent)}
.prow.out{opacity:.62}
.prow.bad{background:color-mix(in srgb,var(--danger) 13%,transparent);opacity:1}
.prow.bad .xi-btn[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.risk{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--surface))}
.risk b{color:var(--danger)}
details.fold>summary{list-style:none;cursor:pointer;min-height:40px;display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:8px 10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .fr{justify-self:end;min-width:0;max-width:min(60vw,420px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
details.fold>summary .sub{grid-column:1/-1}
.chev{color:var(--muted);display:inline-block;transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
details.fold .fb{margin-top:12px}
details.hf>summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
details.hf>summary::-webkit-details-marker{display:none}
.lc{border-radius:14px;padding:12px 14px}
.lc-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;position:relative;z-index:1}
.lc-score .t{display:flex;align-items:center;gap:8px;font:700 20px var(--display);min-width:0}
.lc-score .t:first-child{justify-content:flex-end}
.lc-score b{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}
.lc-ev{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:13px;min-height:1em}
.lc-ev .m{font:700 12px var(--display);opacity:.8;margin-right:6px}
.lc-meta{position:relative;z-index:1;font-size:12px;opacity:.85;margin-top:6px;text-align:center}
.pkrow{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;font:700 14px var(--display);align-items:center}
.pk{display:inline-flex;gap:4px;flex-wrap:wrap}
.pk i{font-style:normal;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;background:#fff;color:#14201a}
.pk i.x{background:var(--danger);color:#fff}
.cgroup{padding:6px 12px 8px}
.cgroup>.label{display:block;padding:6px 0 2px}
.cm{border-bottom:1px solid var(--line)}.cm:last-child{border-bottom:0}
.crow{width:100%;border:0;background:none;display:grid;grid-template-columns:minmax(0,1fr) 50px minmax(0,1fr) auto 12px;align-items:center;gap:6px;padding:6px 0;font:700 15px var(--display);letter-spacing:.04em}
.crow .ch{display:flex;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.crow .ca{display:flex;align-items:center;gap:6px;min-width:0}
.crow .sc{font:700 17px var(--display);text-align:center;border-radius:6px;background:var(--surface2);font-variant-numeric:tabular-nums;padding:1px 0}
.crow .sc.flash{background:var(--goal);color:#1a1a00}
.crow .pn{font:600 11px var(--body);color:var(--muted);letter-spacing:0}
.crow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.cm.me .crow{color:var(--info)}
.dt{padding:2px 0 10px;font-size:13px}
.dt .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.dt ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr) 34px auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.srow.sel{background:color-mix(in srgb,var(--goal) 22%,transparent)}
.srow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idol{color:var(--star)}
.voice .q{margin:0;font:600 18px/1.25 var(--display);letter-spacing:.01em}
.voice .q::before{content:"“";color:var(--muted);margin-right:2px}
.voice .q::after{content:"”";color:var(--muted);margin-left:2px}
.voice .q.ok{font:500 14px var(--body);color:var(--ok)}
.voice .q.ok::before,.voice .q.ok::after{content:none}
.lstat{display:flex;align-items:baseline;gap:10px}
.lstat .clock{font-size:34px}
.lbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.lbar .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.lbar .seg{flex:1 1 auto;min-width:0}
.lbar .seg button{flex:1;padding:8px 6px;font:700 13px var(--display);letter-spacing:.05em}
.lbar .seg{display:flex}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:54px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none}
.ib svg{width:18px;height:18px;fill:currentColor}
.ib small{font:600 10px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.lbar .btn.big{padding:12px}
.linkbtn{border:0;background:none;padding:0;display:flex;gap:8px;align-items:center;font:inherit;color:inherit;text-align:left;min-width:0}
.linkbtn:hover span{text-decoration:underline}
.crow2{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.crow2:last-child{border-bottom:0}
.troph{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.troph div{background:var(--surface2);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.troph svg{width:30px;height:30px;fill:var(--star)}
.troph b{font:700 14px/1.15 var(--display)}
.troph small{color:var(--muted);font-size:11px}
.lvl{display:inline-flex;gap:3px}.lvl i{width:10px;height:10px;border-radius:50%;background:var(--line)}.lvl i.on{background:var(--ok)}
.press button{text-align:left}
.formgrid{display:flex;flex-wrap:wrap;gap:6px}
.formgrid .chip{font:700 15px var(--display);padding:6px 12px}
.field{display:flex;flex-direction:column;gap:12px;padding:16px 6px;
  background:radial-gradient(circle at 50% 50%,transparent 38px,var(--chalk) 39px,var(--chalk) 41px,transparent 42px),
   linear-gradient(0deg,transparent calc(50% - 1px),var(--chalk) calc(50% - 1px),var(--chalk) calc(50% + 1px),transparent calc(50% + 1px)),
   repeating-linear-gradient(0deg,var(--pitch) 0 40px,var(--pitch2) 40px 80px)}
.field::before,.field::after{left:28%;right:28%;width:auto;height:26px;top:auto;bottom:auto;border:2px solid var(--chalk)}
.field::before{top:-2px;border-top:0;border-left:2px solid var(--chalk)}
.field::after{bottom:-2px;border-bottom:0;border-right:2px solid var(--chalk)}
.prow2{display:flex;justify-content:space-evenly;gap:4px;position:relative;z-index:1}
.pchip{width:62px;border:0;border-radius:10px;background:rgba(255,255,255,.94);color:#14201a;padding:4px 2px;display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.15}
.pchip b{font:800 17px var(--display);font-variant-numeric:tabular-nums}
.pchip span{max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px}
.pchip.imp{box-shadow:0 0 0 3px var(--goal)}
.pchip.bad{background:#f7d2cd}
.pchip.empty{background:transparent;border:1.5px dashed rgba(255,255,255,.7);color:#fff;justify-content:center;min-height:40px}
.nextband{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nextband .who{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 200px}
.nextband .who b{display:block;font:700 18px/1.1 var(--display)}
.pos{font:700 12px var(--display);letter-spacing:.05em;border-radius:6px;padding:3px 0;text-align:center;color:#fff}
.pos.G{background:#b7791f}.pos.D{background:#2f5fb3}.pos.M{background:#2e8b57}.pos.A{background:#c0392b}
.pname{min-width:0;border:0;background:none;text-align:left;padding:0}
.pname b{display:block;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.pname small{color:var(--muted);font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.str{font:700 19px var(--display);text-align:center;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.tag{font:700 10.5px var(--display);letter-spacing:.04em;padding:2px 5px;border-radius:4px;background:var(--surface2);color:var(--muted)}
.tag.inj{background:var(--danger);color:#fff}.tag.sus{background:var(--fg);color:var(--bg)}.tag.yel{background:var(--goal);color:#1a1a00}
.spgrid{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;font-size:14px;align-items:baseline}
.spgrid b small{font:400 11px var(--body,inherit);color:var(--muted);margin-left:2px}
.spgrid .muted{font-size:12.5px}
.finrow{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:14px;align-items:baseline}
.finbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.finbar i{display:block;height:100%;border-radius:3px;opacity:.75}
.matchinfo{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px;text-align:center}
.matchinfo>div{background:rgba(8,40,22,.82);border-radius:10px;padding:7px 4px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;min-width:0}
.matchinfo>.wide{grid-column:1/-1}
.matchinfo b.sm{font:600 13px var(--body);line-height:1.3}
.matchinfo>div>b{white-space:nowrap}.matchinfo b.mid{white-space:normal;font-size:14px;line-height:1.15}.matchinfo .muted{text-transform:none;letter-spacing:0;font:500 13px var(--body)}.matchinfo>.wide>b{white-space:normal}
.matchinfo span{font:600 10.5px var(--display);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.matchinfo b{font:800 16px var(--display)}
.matchinfo span{line-height:1.15}
.matchinfo .muted{color:inherit;opacity:.85;font-size:12px}

function readKey(k){try{return localStorage.getItem(k)}catch(e){return null}}
function loadSaved(k){const s=readKey(k||SAVE_KEY);if(!s)return null;try{return JSON.parse(s)}catch(e){return null}}

function validState(o){
  if(!o||typeof o!=='object')return 'o conteúdo não é um jogo salvo';
  if(!Array.isArray(o.teams)||o.teams.length<32)return 'a lista de clubes está incompleta';
  if(!o.players||typeof o.players!=='object'||Array.isArray(o.players))return 'a lista de jogadores está faltando';
  if(!Array.isArray(o.managers)||!o.managers.length)return 'não há técnicos';
  if(typeof o.season!=='number'||o.season<1)return 'a temporada é inválida';
  const seen={};
  for(let i=0;i<o.teams.length;i++){const t=o.teams[i];if(!t||t.id!==i||typeof t.name!=='string'||!Array.isArray(t.players))return 'o clube '+(i+1)+' está corrompido';
    for(const id of t.players){const p=o.players[id];if(!p||p.team!==i)return 'há jogadores sem cadastro';if(seen[id])return 'há jogadores duplicados';seen[id]=1;if(typeof p.name!=='string'||typeof p.str!=='number')return 'há jogadores corrompidos'}}
  for(const m of o.managers){if(!m||typeof m.name!=='string')return 'um técnico está corrompido';if(!m.out&&m.team!=null&&!o.teams[m.team])return 'um técnico aponta para um clube inexistente'}
  return null}

  try{migrate();const e2=validState(S);if(e2)throw new Error(e2);const ok=S;S=prev;return ok}catch(e){S=prev;throw new Error(e&&e.message?e.message:'a migração falhou')}}

  try{o=c[0]==='{'?JSON.parse(c):JSON.parse(decodeURIComponent(escape(atob(c.replace(/\s+/g,'')))))}catch(e){throw new Error('o código está incompleto ou não é do Prancheta FC')}
  return prepState(o)}

    if(offs.length){if(H){t.sOffers=[offs[0],...(t.sOffers||[]).filter(o=>!o.spont)].slice(0,3);news(`Embalado, o ${t.name} recebe proposta de patrocínio da ${offs[0].name}. Vale por 3 datas.`,[t.id]);if(rep&&rep[t.id])rep[t.id].offers.push(`A ${offs[0].name} quer patrocinar o clube (vale por 3 datas).`)}
      else{const o=bestSpon(t,offs);const cc=sponCancelCost(t);if(sponGuar(o,t)-cc>cur*1.1){t.cash-=cc;t.spon=o;news(`${t.name} fecha novo patrocínio com a ${o.name} após a boa fase.`)}}}
    if(!t.nr&&eligibleNR(t)&&Math.random()<.5){const no=namingOffers(t);if(H){t.nOffers=no;news(`Empresas querem dar nome ao estádio do ${t.name}.`,[t.id])}
      else{const o=no.sort((a,b)=>(b.upfront+b.perData*14*b.seasons)-(a.upfront+a.perData*14*a.seasons))[0];t.nr={name:o.name,perData:o.perData,upfront:o.upfront,seasons:o.seasons,left:o.seasons};t.cash+=o.upfront;t.stadium='Arena '+o.name;news(`O estádio do ${t.name} passa a se chamar ${t.stadium}.`)}}}
  S.teams.forEach(t=>{if(t.sOffers&&t.sOffers.length)t.sOffers=t.sOffers.filter(o=>!o.spont||o.exp>=S.md+1)})}
function aiTvAdv(t,why){if(t.tvAdv)return false;const a=Math.floor(nextTV(t)*.6*.6/5e4)*5e4;if(a<1e5)return false;const owed=r1k(a*1.15);
  t.cash+=a;t.tvAdv={owed,season:S.season+1,amount:a};news(`${t.name} antecipa ${money(a)} da cota de TV${why?' '+why:''}.`);return true}
function aiFinance(){for(const t of S.teams){if(t.foreign||isHuman(t.id)||t.div>=5)continue;
  if(!t.loan&&t.cash<payroll(t)*2){if(!aiTakeLoan(t,'para pagar a folha')&&t.cash<payroll(t))aiTvAdv(t,'para pagar a folha')}
  else if(t.loan&&t.cash<0){if(!aiTvAdv(t,'para cobrir o caixa negativo')&&!t.floan)aiTakeLoan(t,'para cobrir o caixa negativo')}}}
function promotedReinforce(ids){const XI={};S.teams.forEach(x=>{if(!x.foreign)XI[x.id]=new Set(bestXI(x,[4,4,2]))});for(const id of ids){const t=T(id);if(!t||isHuman(id)||t.div>=5||banned(t))continue;const others=S.teams.filter(x=>x.div===t.div&&x.id!==id);const target=Math.round(others.reduce((a,x)=>a+teamRating(x),0)/others.length);let n=0,need=4;
    for(let k=0;k<8&&n<need;k++){if(teamRating(t)>=target-2)break;const xi=bestXI(t,[4,4,2]).map(P);const pc=posCount(t);const weak=xi.filter(p=>p.pos!=='G'&&pc[p.pos]<PMAX[p.pos]).sort((a,b)=>a.str-b.str)[0];if(!weak||weak.str>=target)break;
      const c=Object.values(S.players).filter(p=>p.pos===weak.pos&&p.team!=null&&p.team!==id&&!p.loan&&!isHuman(p.team)&&!T(p.team).world&&(T(p.team).foreign||T(p.team).div>t.div||!(XI[p.team]&&XI[p.team].has(p.id)))&&forOK(t,p)&&T(p.team).players.length>16&&p.str>=target-2&&p.str<=target+6&&p.age<=31).sort((a,b)=>value(a)-value(b)).slice(0,6);
      if(!c.length)break;const p=pick(c);const price=r1k(value(p)*1.1);if(t.cash<price*1.1&&(t.loan||!aiTakeLoan(t,'para se reforçar após o acesso')))break;if(t.cash<price)break;
      const from=T(p.team);transfer(p.id,id,price);p.sal=wage(p);p.cEnd=S.season+ri(1,3);n++;news(`Recém-promovido, o ${t.name} contrata ${p.name} (${from.short}) por ${money(price)}.`)}}}
function relegatedSell(ids){for(const id of ids){const t=T(id);if(!t||isHuman(id))continue;const others=S.teams.filter(x=>x.div===t.div&&x.id!==id);const avg=others.reduce((a,x)=>a+teamRating(x),0)/others.length;const ps=squad(t).filter(p=>!p.loan&&!p.idol).sort((a,b)=>b.str-a.str).slice(0,6);let k=0;
    for(const p of ps){if(t.players.length<=15)break;if(k>=2&&teamRating(t)<=avg+3)break;k++;const price=r1k(value(p));const fr=S.teams.filter(x=>x.foreign&&x.players.length<26);const b=(Math.random()<.7&&fr.length?pick(fr):null)||S.teams.filter(x=>!isHuman(x.id)&&!x.foreign&&x.div<t.div&&x.cash>=price*1.2&&x.players.length<24&&forOK(x,p)).sort((a,c)=>c.cash-a.cash)[0]||pick(fr);if(!b)continue;
      transfer(p.id,b.id,price);p.sal=wage(p);p.cEnd=S.season+ri(1,3);news(`Rebaixado, o ${t.name} vende ${p.name} ao ${b.name} por ${money(price)}.`)}}}
const debtTot=t=>(t.loan?t.loan.owe+(t.loan.pen||0):0)+(t.floan?t.floan.owe+(t.floan.pen||0):0)+Math.max(0,-t.cash);
const yearRev=t=>Math.max(1,revPerData(t)*NL());
const banned=t=>t&&t.ban!=null&&S.season<=t.ban;
function crisisCheck(){for(const t of S.teams){if(t.foreign||t.div>=5)continue;if(t.crisisS!=null&&S.season-t.crisisS<2)continue;
    const d=debtTot(t),late=(t.loan&&t.loan.late||0)+(t.floan&&t.floan.late||0);if(d<yearRev(t)||(late<2&&t.cash>-yearRev(t)*.5))continue;
    t.crisisS=S.season;const big=audF(t)>=1.2;const inv=Math.random()<(big?.7:.45);
    if(inv){const inj=r1k(CASH[t.div]*rnd(.8,1.2));t.loan=null;t.floan=null;t.cash=Math.max(0,t.cash)+inj;t.sled&&book(t,'loanIn',0);
      news(`Virada no ${t.name}: investidor compra o clube (SAF), quita ${money(d)} em dívidas e coloca ${money(inj)} no caixa.`,isHuman(t.id)?[t.id]:[]);
      const mg=mgrOf(t.id);
      if(mg){if(Math.random()<.3){fire(mg,'O investidor que comprou o clube trouxe o próprio técnico.')}
        else{mg.conf=50;if(mg.goal){mg.goal.max=Math.max(0,mg.goal.max-2)}news(`A nova diretoria do ${t.name} mantém ${mg.name}, mas exige mais: ${mg.goal?goalText(mg.goal):'resultados imediatos'}.`,[t.id])}}
      else if(t.coach){const oc=t.coach;t.coach=hireCoach(t,oc);releaseCoach(oc,t);news(`Os novos donos do ${t.name} trocam o técnico: sai ${oc.name}, entra ${t.coach.name}${coachFrom(t.coach).replace(/,$/,'')}.`)}}
    else{const pts=t.div<4&&S.tab[t.id]&&S.cal.slice(S.md).some(e=>e.t==='L')?6:0;if(pts)S.tab[t.id].pts-=pts;t.ban=S.season+(S.cal.slice(S.md).filter(e=>e.t==='L').length>=5?0:1);
      [t.loan,t.floan].forEach(L=>{if(L){L.late=0;L.pen=0;L.gate=false}});
      news(`Punição ao ${t.name} por dívidas: ${pts?`perde ${pts} pontos no Nacional e `:''}fica proibido de contratar até o fim da temporada ${t.ban}. As dívidas foram renegociadas, sem multas.`,isHuman(t.id)?[t.id]:[])}}}
function riskBanner(){const m=me();if(!m||m.fired||m.conf>=25)return '';
  return `<div class="panel stack risk" role="alert"><b>Cargo em risco</b><span style="font-size:14px">A confiança da diretoria está em ${m.conf}/100. ${m.conf<12?'Mais uma ou duas derrotas e você será demitido.':'Uma sequência ruim pode custar seu emprego.'} Vitórias e um caixa positivo ajudam a recuperar.</span></div>`}

function mkPool(t){const mk={};S.market.forEach(x=>mk[x.pid]=x.price);
  if(UI.mview==='free')return (S.free||[]).filter(id=>P(id)&&P(id).team==null).map(id=>{const a=freeAsk(P(id),t);return {pid:id,price:a.fee,free:true,no:!a.ok}});
  if(UI.mview==='loan'){const xi={};return Object.values(S.players).filter(p=>{if(p.team==null||isHuman(p.team)||p.loan||p.idol)return false;const o=T(p.team);if(o.foreign||o.players.length<=16)return false;
      if(!xi[o.id])xi[o.id]=new Set(bestXI(o,[4,4,2]));return !xi[o.id].has(p.id)}).map(p=>({pid:p.id,price:r1k(value(p)*.08),loan:true}))}
  if(UI.mview==='all')return Object.values(S.players).filter(p=>p.team!=null&&!isHuman(p.team)&&!p.loan).map(p=>mk[p.id]!=null?{pid:p.id,price:mk[p.id]}:{pid:p.id,price:value(p),bid:true});
  return S.market.filter(x=>P(x.pid)&&P(x.pid).team!=null&&!isHuman(P(x.pid).team)).map(x=>({...x}))}
const MFDEF={min:'',max:'',pot:'',age:'',price:'',sal:'',div:'',nat:'',ctr:'',kind:'all',q:''};

  add(q,x=>P(x.pid).name.toLowerCase().includes(q)||(!x.free&&T(P(x.pid).team).name.toLowerCase().includes(q)));
  add(+mf.min,x=>P(x.pid).str>=+mf.min);add(+mf.max,x=>P(x.pid).str<=+mf.max);
  add(+mf.pot,x=>potRange(P(x.pid))[1]>=+mf.pot);add(+mf.age,x=>P(x.pid).age<=+mf.age);

  add(mf.kind==='deal'&&!free,x=>!x.bid&&x.price/value(P(x.pid))<=1.12);

  const sorters={str:(a,b)=>P(b.pid).str-P(a.pid).str,pot:(a,b)=>potRange(P(b.pid))[1]-potRange(P(a.pid))[1],price:(a,b)=>a.price-b.price,

function matchAnalysis(R,t){const m=R.match;const me=m.h===t.id?'h':'a',op=me==='h'?'a':'h';const s=m.st;const nm=pid=>P(pid)?esc(P(pid).name):'—';
  const pc=x=>s[x].n?Math.round(s[x].ps/s[x].n*100):50;const gf=me==='h'?m.hg:m.ag,ga=me==='h'?m.ag:m.hg;
  const cards=(m.cards||[]);const cy=x=>cards.filter(c=>c[0]===x&&c[1]==='y').length,cr=x=>cards.filter(c=>c[0]===x&&c[1]==='r').length;
  const row=(l,a,b,hi)=>`<div class="srow2"><b class="num ${hi===1?'win':''}">${a}</b><span>${l}</span><b class="num ${hi===2?'win':''}">${b}</b></div>`;
  const cmp=(a,b)=>a>b?1:b>a?2:0;
  const H=m.h===t.id,L=H?'h':'a';
  const stats=`<div class="srow2 head"><span>${esc(T(m.h).short)}</span><span></span><span>${esc(T(m.a).short)}</span></div>
    ${row('Posse de bola',pc('h')+'%',pc('a')+'%',cmp(pc('h'),pc('a')))}${row('Finalizações',s.h.sh,s.a.sh,cmp(s.h.sh,s.a.sh))}${row('No alvo',s.h.on,s.a.on,cmp(s.h.on,s.a.on))}
    ${row('Gols',m.hg,m.ag,cmp(m.hg,m.ag))}${row('Amarelos',cy('h'),cy('a'),0)}${cr('h')||cr('a')?row('Vermelhos',cr('h'),cr('a'),0):''}`;
  // leitura do jogo: só a partir dos dados calculados
  const obs=[];const sm=s[me],so=s[op];const my=(m.sty||[])[me==='h'?0:1]||'N',oy=(m.sty||[])[me==='h'?1:0]||'N';
  obs.push(`Seu estilo: <b>${STYLES[my][0]}</b> · adversário: <b>${STYLES[oy][0]}</b>.`);
  if(pc(me)>=58)obs.push(`Dominou a posse (${pc(me)}%).`);else if(pc(me)<=42)obs.push(`Jogou sem a bola: ${pc(me)}% de posse.`);
  if(sm.sh>=8&&gf<=1)obs.push(`Finalizou ${sm.sh} vezes (${sm.on} no alvo) e marcou ${gf}: faltou pontaria.`);
  else if(sm.sh&&gf>=2&&gf/sm.sh>=.25)obs.push(`Aproveitamento alto: ${gf} gols em ${sm.sh} finalizações.`);
  if(so.on>=5&&ga<=1)obs.push(`A defesa segurou: o rival acertou ${so.on} no alvo e marcou ${ga}.`);
  if(sm.sh<=5)obs.push(`Criou pouco: só ${sm.sh} finalizaç${sm.sh===1?'ão':'ões'}.`);
  if(my==='C'&&gf>ga&&pc(me)<45)obs.push(`O contra-ataque funcionou: venceu com ${pc(me)}% de posse.`);
  if(my==='H')obs.push('A pressão alta cobra o preço: os titulares perderam mais condição física que o normal.');
  if(oy==='H'&&my==='P')obs.push('A pressão alta do rival atrapalhou a sua troca de passes.');
  // substituições
  const subs=(m.subs||[]).filter(x=>x[1]===me);const ratOf=pid=>{const r=R.rat.find(x=>x[0]===pid);return r?String(r[1].toFixed(1)).replace('.',','):'—'};
  const subH=subs.length?`<span class="label" style="margin-top:6px">Substituições</span>${subs.map(([mn,,inn,out])=>{const g=(m.ev||[]).filter(e=>e[2]===inn&&e[0]>=mn).length;return `<div style="font-size:14px">${mn}' <b>${nm(inn)}</b> no lugar de ${nm(out)} · nota ${ratOf(inn)}${g?` · ${g} gol${g>1?'s':''}`:''}</div>`}).join('')}`:'';
  // condição após o jogo
  const xi=(R.xi||[]).map(P).filter(Boolean);const avg=xi.length?Math.round(xi.reduce((a,p)=>a+(p.fit??100),0)/xi.length):null;const low=xi.filter(p=>(p.fit??100)<70);
  const fit=avg!=null?`<span class="label" style="margin-top:6px">Condição física após o jogo</span><div style="font-size:14px">Média dos titulares: <b style="color:${avg<70?'var(--danger)':avg<85?'var(--warn)':'var(--ok)'}">${avg}%</b>${low.length?` · abaixo de 70%: ${low.map(p=>esc(p.name)+' '+(p.fit??100)+'%').join(', ')}`:''}</div>`:'';
  // classificação
  let cls='';if(m.comp==='L'&&R.posB!=null&&R.table){const pa=R.table.findIndex(r=>r[0]===t.id);const d=R.posB-pa;cls=`<span class="label" style="margin-top:6px">Classificação</span><div style="font-size:14px">${R.posB+1}º → <b>${pa+1}º</b> ${d>0?`<span class="up">▲ subiu ${d}</span>`:d<0?`<span class="dn">▼ caiu ${-d}</span>`:'(manteve)'} · ${R.table[pa][1]} pts</div>`}
  return `<div class="panel stack"><span class="label">Estatísticas da partida</span>${stats}
    <span class="label" style="margin-top:6px">Leitura do jogo</span><ul class="news" style="margin:0">${obs.slice(0,3).map(o=>`<li>${o}</li>`).join('')}</ul></div>
    ${subH||fit||cls||obs.length>3?fold('posAna','Detalhes do jogo',avg!=null?`<span class="muted" style="font-size:13px">condição ${avg}%</span>`:'','',`${obs.length>3?`<ul class="news" style="margin:0">${obs.slice(3).map(o=>`<li>${o}</li>`).join('')}</ul>`:''}${subH}${fit}${cls}${note('Posse e finalizações são calculadas minuto a minuto pelo motor; os gols saem dessas finalizações.')}`):''}`}

function evText(ev){const p=P(ev.pid);const n=p?esc(p.name):'—';
  if(ev.type==='goal')return `<span class="ev-goal">⚽ Gol${ev.pk?' de pênalti':''}! ${n}</span>`;
  if(ev.type==='pmiss')return `<span style="color:var(--danger);font-weight:700">✗</span> Pênalti perdido por ${n}`;
  if(ev.type==='y')return `<span class="sq y"></span> ${n}`;
  if(ev.type==='r')return `<span class="sq r"></span> ${n} expulso`;
  if(ev.type==='inj')return `<span style="color:var(--danger);font-weight:700">+</span> ${n} lesionado`;
  if(ev.type==='sub')return `↔ Entra ${n}${ev.pid2&&P(ev.pid2)?', sai '+esc(P(ev.pid2).name):''}`;return ''}
function liveGroups(){
  const L=UI.live;const idx=L.ms.map((m,i)=>i);

  if(c0!=='L'){if(UI.prefs.others==='none')return [];const ids=UI.prefs.others==='mine'?idx.filter(i=>humanIn(L.ms[i])):idx;
    if((c0==='E'||c0==='ES'||c0==='EF'||c0==='K')){const gs=[...new Set(ids.map(i=>L.ms[i].grp))];return gs.map(g=>({title:c0==='K'?`Continental · Grupo ${'ABCD'[g]}`:`${estTitle(g)}`,ids:ids.filter(i=>L.ms[i].grp===g)}))}
    return [{title:L.cupName,ids}]}
  const md=myTeam()?myTeam().div:3;const order=[md,...[0,1,2,3].filter(d=>d!==md)];
  const ord=UI.prefs.others==='none'?[]:UI.prefs.others==='mine'?[md]:order;
  return ord.map(d=>({title:DIVN[d],ids:idx.filter(i=>L.ms[i].div===d)}))}
function penTxt(m){if(m.pens)return `pên ${m.pens[0]}–${m.pens[1]}`;if(m.pk)return `pên ${m.pk.h.filter(x=>x[1]).length}–${m.pk.a.filter(x=>x[1]).length}`;return m.et?'prorr.':''}
function evLine(ev,m){return `<li><span class="m">${ev.min}'</span> ${esc(T(ev.side==='h'?m.h.tid:m.a.tid).short)} ${evText(ev)}</li>`}
function pkDots(arr){return `<span class="pk">${arr.map(([pid,ok])=>`<i class="${ok?'':'x'}" title="${esc(P(pid)?.name||'')}">${ok?'✓':'✗'}</i>`).join('')}</span>`}
function liveCompact(m){

  const last=humanIn(m)?[...pool.filter(big),...pool.filter(e=>!big(e)).slice(-2)].sort((a,b)=>b.min-a.min).slice(0,8):pool.slice(-3).reverse();
  return `<div class="pitch lc"><div class="lc-score"><span class="t">${esc(T(m.h.tid).short)}${crest(m.h.tid)}</span><b>${m.h.goals}–${m.a.goals}</b><span class="t">${crest(m.a.tid)}${esc(T(m.a.tid).short)}</span></div>
    ${m.pk?`<div class="pkrow"><span>${esc(T(m.h.tid).short)}</span>${pkDots(m.pk.h)}<span>${esc(T(m.a.tid).short)}</span>${pkDots(m.pk.a)}</div>`:''}
    <ul class="lc-ev" style="list-style:none;margin:8px 0 0;padding:0">${last.map(e=>evLine(e,m)).join('')||'<li style="opacity:.8">Bola rolando…</li>'}</ul>

    <div class="lc-meta">${m.derby?'Clássico · ':''}${m.et?'Prorrogação · ':''}Público ${m.att.toLocaleString('pt-BR')} (${Math.round(m.occ*100)}%) · fator casa +${Math.round((m.hf-1)*100)}%</div></div>`}

  offerNo(d){const mg=me();const o=mg.offers[+d.i];mg.offers.splice(+d.i,1);if(o&&T(o.tid).div<=T(mg.team).div){mg.conf=clamp(mg.conf+3,0,100);news(`${mg.name} recusa proposta do ${T(o.tid).name} e ganha pontos com a diretoria.`,[mg.team])}else if(o)news(`${mg.name} recusa a proposta do ${T(o.tid).name} e fica no ${T(mg.team).name}.`,[mg.team]);save();render()},
  play(){const w=playWarnings(myTeam());if(w.length&&UI.playAck!==absMd()){UI.sheet={type:'prePlay',w};renderModal();return}startMatchday()},
  playYes(){UI.playAck=absMd();UI.sheet=null;renderModal();startMatchday()},
  elv(d){UI.ev=d.v;UI.tab='elenco';UI.sheet=null;render();window.scrollTo(0,0)},
  speedCycle(){const L=UI.live;L.speed=L.speed%3+1;UI.prefs.speed=L.speed;savePrefs();render();tick()},
  pref(d){let v=d.v;if(d.k==='speed')v=+v;if(d.k==='stopHT')v=v==='1';UI.prefs[d.k]=v;savePrefs();render()},
  pause(){const L=UI.live;L.paused=true;clearTimeout(L.timer);liveSnap();render()},
  resume(){const L=UI.live;if(L.phase==='INT')L.phase='2T';if(L.phase==='PRE')L.phase='ET1';L.paused=false;L.sub=null;render();tick()},
  xm(d){const L=UI.live;const i=+d.i;L.open[i]=!L.open[i];const dt=$('#dt'+i);if(dt){dt.hidden=!L.open[i];dt.innerHTML=L.open[i]?detailHTML(L.ms[i]):'';dt.previousElementSibling.setAttribute('aria-expanded',L.open[i])}},
  subOut(d){const L=UI.live;L.sub=L.sub&&L.sub.out===d.pid?null:{tid:+d.tid,out:d.pid};render()},
  subIn(d){const L=UI.live;const s=L.sub;if(!s)return;const m=L.ms.find(x=>x.h.tid===s.tid||x.a.tid===s.tid);const X=m.h.tid===s.tid?m.h:m.a;
    if(X.subs<=0||!X.on.includes(s.out)){L.sub=null;render();return}
    const inn=d.pid;X.on=X.on.map(i=>i===s.out?inn:i);X.slot[inn]=X.slot[s.out]||P(s.out).pos;X.played.push(inn);X.bench=X.bench.filter(i=>i!==inn);X.subs--;
    m.ev.push({min:L.min,side:m.h===X?'h':'a',type:'sub',pid:inn,pid2:s.out});L.sub=null;render()},
  liveForm(d){const t=T(+d.tid);t.formSel=d.v;const m=UI.live.ms.find(x=>x.h.tid===t.id||x.a.tid===t.id);const X=m.h.tid===t.id?m.h:m.a;X.slot=assignSlots(X.on,fArr(d.v));save();render()},
  skip(){const L=UI.live;clearTimeout(L.timer);L.paused=false;let r,g=0;while(g++<600){r=advance();if(r)break}if(r==='end')endLive();else render()},
  liveTac(d){T(+d.tid).tactic=d.v;render()},
  liveDone(){UI.live=null;UI.flow=true;const t=myTeam();const R=t&&S.rep&&S.rep[t.id];if(R&&!R.match&&!S.over&&!(R.press&&R.press.done==null)){afterRep();return}UI.tab='pos';render();window.scrollTo(0,0)},
  repDone(){afterRep()},
  decDone(){if(decLeft()){toast('Responda as propostas antes de continuar.');return}paperAddDecisions();save();ACT.paperOpen({i:0})},
  endSeason(){if(!S.over||S.summary)return;endSeason();render();window.scrollTo(0,0)},
  summaryOk(){S.summary=null;save();UI.tab=S.managers[UI.cur]?.fired?'jogo':(S.managers[UI.cur]?.offers.length||myTeam()?.sOffers.length?'clube':'jogo');render();window.scrollTo(0,0)},
  job(d){const m=me(),t=T(+d.tid);if(!m||!m.fired||!t||t.div>=5||isHuman(t.id)||!(m.jobs||[]).includes(t.id)){toast('Esta proposta não está mais disponível.');if(m&&m.fired){m.jobs=pickClubs(m,'down',3);save()}render();return}takeJob(m,t.id);UI.tab='jogo';render()},
  waitDate(){const m=me();if(!m||!m.fired)return;if(S.over){ACT.endSeason();return}m.wait=(m.wait||0)+1;if(m.wait%5===0)m.rep=Math.max(0,(m.rep??10)-1);
    startMatchday();const mm=S.managers.find(x=>x===m);if(mm&&mm.fired)mm.jobs=mm.resigned?resignJobs(mm):pickClubs(mm,'down',3);save();render()},
  resignAsk(){UI.resign=true;render()},resignNo(){UI.resign=false;render()},
  resignYes(){const m=me(),t=myTeam();if(!m||!t)return;const pen=S.over?0:3;UI.resign=false;m.rep=Math.max(0,(m.rep??10)-pen);m.fired=true;m.resigned=true;m.firedFrom=t.id;m.why='';m.offers=[];m.wait=0;
    t.pOffers=[];t.lOffers=[];t.sOffers=[];t.nOffers=[];squad(t).forEach(p=>{delete p.sale;delete p.lendAsk});t.lineup=bestXI(t,[4,4,2]);S.decReq=[];UI.flow=false;
    m.jobs=resignJobs(m);ensureCoaches();news(`${m.name} pede demissão do ${t.name}.${t.coach?` ${t.coach.name}${coachFrom(t.coach)} assume.`:''}`,[t.id]);save();UI.tab='jogo';render();window.scrollTo(0,0)},
  retire(){const m=me();m.out=true;m.fired=false;const n=S.managers.findIndex(x=>!x.out);UI.cur=n<0?0:n;save();render()},
  rename(){const t=myTeam();const v=$('#rename').value.trim();if(!v)return;t.name=v;t.short=shortOf(v);t.baseStadium='Estádio '+v;if(!t.nr)t.stadium=t.baseStadium;save();render();toast('Clube renomeado.')},
  exportOpen(){UI.sheet={type:'export'};renderModal()},
  copyExport(){const ta=$('#exportbox');const txt=ta.value;
    S.lastExp=S.season;save();try{navigator.clipboard.writeText(txt).then(()=>toast('Código copiado.'),()=>{ta.select();toast('Selecionado. Copie com o menu do aparelho.')})}catch(e){ta.select();toast('Selecionado. Copie com o menu do aparelho.')}},
  importOpen(d){if(!S&&d&&d.slot!=null)setSlot(+d.slot);UI.sheet={type:'import'};renderModal()},
  doImport(){try{const ns=importCode($('#importbox').value);backup();S=ns;UI.sheet=null;UI.setup=null;UI.cur=Math.max(0,S.managers.findIndex(m=>!m.out));UI.tab='jogo';UI.live=null;save();render();if(!resumeLive())toast('Jogo carregado.')}
    catch(e){UI.sheet.msg=`Não foi possível importar: ${e&&e.message?e.message:'código inválido'}. Seu jogo atual não foi alterado.`;renderModal()}},
  async exportFile(){const name=`prancheta-fc-T${S.season}.txt`,code=exportCode();
    if(window.claude&&typeof window.claude.use==='function'){toast('Preparando o arquivo…');let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
      if(dl){try{await dl.save({filename:name,data:code});S.lastExp=S.season;save();toast('Arquivo salvo.')}catch(e){toast(e&&e.code==='declined'?'Download cancelado.':'Não foi possível baixar aqui. Use Copiar.')}return}
      toast('Download indisponível aqui. Use Copiar.');return}
    try{const blob=new Blob([code],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();S.lastExp=S.season;save();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Arquivo gerado. Se não baixar, use Copiar.')}catch(e){toast('Este navegador não permitiu baixar. Use Copiar.')}},
  restoreBak(){const s=readKey(BAK_KEY);if(!s){toast('Não há cópia de segurança.');return}try{const ns=prepState(JSON.parse(s));S=ns;UI.cur=Math.max(0,S.managers.findIndex(m=>!m.out));UI.tab='jogo';UI.sheet=null;UI.setup=null;UI.live=null;save();render();if(!resumeLive())toast('Cópia de segurança restaurada.')}catch(e){toast('A cópia de segurança também está danificada.')}},
  newGame(){UI.confirmNew=true;render()},
  restoreAsk(){UI.confirmBak=true;render()},
  restoreNo(){UI.confirmBak=false;render()},
  newGameNo(){UI.confirmNew=false;render()},
  slotDel(d){UI.delSlot=+d.slot;render()},
  slotDelNo(){UI.delSlot=null;render()},
  slotDelYes(d){const cur=SLOT;setSlot(+d.slot);backup();try{localStorage.removeItem(SAVE_KEY)}catch(e){}setSlot(cur);UI.delSlot=null;render();toast('Espaço apagado.')},
  toMenu(){save();if(UI.live&&UI.live.timer)clearTimeout(UI.live.timer);S=null;UI={...UI,live:null,sheet:null,setup:null,confirmNew:false,flow:false,tab:'jogo'};render();window.scrollTo(0,0)},
  newGameYes(){backup();try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=null;UI={...UI,confirmNew:false,live:null,sheet:null,tab:'jogo'};ACT.setup()}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el.dataset,el,ev)});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d&&d.dataset&&d.dataset.fold){UI.folds[d.dataset.fold]=d.open;try{localStorage.setItem('prancheta-folds',JSON.stringify(UI.folds))}catch(e){}}},true);
document.addEventListener('input',ev=>{const el=ev.target;const k=el.dataset.in;if(!k)return;
  if(k==='rng'){const kind=el.dataset.kind,arg=el.dataset.arg,v=+el.value;rngSet(kind,arg,v);const o=document.getElementById('rv_'+kind+'_'+arg);if(o)o.textContent=rngLabel(kind,arg,v);if(kind==='renS'||kind==='renL'){const c=document.getElementById('rc_'+arg);if(c)c.innerHTML=renChanceTxt(P(arg))}return}
  if(k==='mq'){UI.mf={...(UI.mf||{}),q:el.value};UI.mlimit=20;clearTimeout(UI.mqT);UI.mqT=setTimeout(()=>{const pos=el.selectionStart;render();const n=$('#mq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},250);return}
  if(!UI.setup)return;const st=UI.setup;
  if(k==='mname')st.mgrs[+el.dataset.i].name=el.value;
  if(k==='tname'){st.names[+el.dataset.d][+el.dataset.i]=el.value}});
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.dataset.in==='rng'){if(UI.sheet)renderModal();else render();return}
  if(el.dataset.in==='mf'){UI.mf={...(UI.mf||{}),[el.dataset.k]:el.value};UI.mlimit=20;render();return}
  if(el.dataset.in==='tart'){UI.tart=el.value;render();return}if(el.dataset.in==='msort'){UI.msort=el.value;UI.mlimit=20;render();return}if(el.dataset.in==='mteam'&&UI.setup){UI.setup.mgrs[+el.dataset.i].team=+el.value;
  const st=UI.setup;$('#dupwarn').hidden=new Set(st.mgrs.slice(0,st.n).map(m=>+m.team)).size===st.n}
  if(el.dataset.in==='tname'&&UI.setup){render()}
  if(el.dataset.in==='importfile'&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=()=>{const b=$('#importbox');if(b)b.value=String(fr.result||'');toast('Arquivo lido. Toque em Carregar jogo.')};fr.onerror=()=>toast('Não foi possível ler o arquivo.');fr.readAsText(el.files[0])}});

function start(data){
  if(data&&data.S){S=data.S;migrate();UI.cur=data.cur||0;UI.tab='jogo'}
  render()}
window.claude?.hot?.snapshot?.(()=>({S,cur:UI.cur}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body></html>
